name: Sign personal build

on:
    push:
        branches:
            - personal
    workflow_dispatch:

permissions:
    contents: write

jobs:
    sign:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            - uses: jdx/mise-action@v4
              with:
                  install: true
                  cache: true
                  experimental: true
            - name: Read version from manifest
              id: version
              run: |
                  version=$(node -p "require('./src/manifest.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            - name: Lint
              run: mise run lint
            - name: Build and sign (unlisted)
              env:
                  WEB_EXT_CHANNEL: unlisted
                  WEB_EXT_APPROVAL_TIMEOUT: 604800000
                  WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
                  WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
              run: mise run sign
            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  name: personal-${{ steps.version.outputs.version }}
                  tag_name: personal-${{ steps.version.outputs.version }}
                  generate_release_notes: true
                  files: web-ext-artifacts/*.xpi
